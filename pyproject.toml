[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexsi-agent-circuit-defense"
version = "0.1.0"
description = "Provable Indirect Prompt Injection Defense via Subspace Weight Surgery on Cohere Aya Expanse 8B"
readme = "README.md"
authors = [{ name = "GiGi Koneti", email = "gigikoneti@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "peft>=0.12.0",
    "safetensors>=0.4.5",
    "sentencepiece>=0.2.0",
    "datasets>=3.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "plotly>=5.24.0",
    "gradio>=4.44.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.66.5",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "black>=24.8.0",
    "isort>=5.13.0",
]
lexsi = [
    "auditkit",
    "curatorkit",
    "circuitkit",
    "safetune",
]

[tool.setuptools.packages.find]
where = ["src"]
